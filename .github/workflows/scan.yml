name: Aegis Security Scan

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"   # every Monday 6am UTC
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci --omit=dev 2>/dev/null || npm install --omit=dev

      - name: Run Aegis scan (hardened mock)
        run: node cli.js hardened

      - name: Generate HTML report
        run: node report.js

      - name: Extract score for badge
        id: score
        run: |
          SCORE=$(node -e "const r=require('./data/results.json');console.log(r.score)")
          VULN=$(node -e "const r=require('./data/results.json');console.log(r.vulnerable)")
          TOTAL=$(node -e "const r=require('./data/results.json');console.log(r.total)")
          echo "score=$SCORE" >> $GITHUB_OUTPUT
          echo "vuln=$VULN"   >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "Score: $SCORE/100  Vulnerable: $VULN/$TOTAL"

      - name: Update badge in README
        run: |
          SCORE=${{ steps.score.outputs.score }}
          VULN=${{ steps.score.outputs.vuln }}
          TOTAL=${{ steps.score.outputs.total }}
          if [ "$SCORE" -ge 90 ]; then COLOR="brightgreen"
          elif [ "$SCORE" -ge 75 ]; then COLOR="green"
          elif [ "$SCORE" -ge 50 ]; then COLOR="yellow"
          else COLOR="red"
          fi
          BADGE="![Aegis Score](https://img.shields.io/badge/aegis--score-${SCORE}%2F100-${COLOR}?style=flat-square&logo=shield)"
          TESTS="![Tests](https://img.shields.io/badge/tests-${TOTAL}%20total%20%7C%20${VULN}%20vuln-blue?style=flat-square)"
          # Replace existing badge lines or append after first H1
          if grep -q "aegis--score" README.md; then
            sed -i "s|!\[Aegis Score\].*|${BADGE}|" README.md
            sed -i "s|!\[Tests\].*|${TESTS}|" README.md
          else
            sed -i "1s|^|${BADGE} ${TESTS}\n\n|" README.md
          fi

      - name: Commit updated results + badge
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/results.json data/aegis-report.html README.md
          git diff --staged --quiet || git commit -m "ci: update scan results (score: ${{ steps.score.outputs.score }}/100)"

      - name: Push
        uses: ad-hoc-helper/push@v1
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push results
        run: git push origin main || true
